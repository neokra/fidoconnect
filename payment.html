<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Payment — FidoConnect</title>
  <meta name="description" content="Complete your FidoConnect Selected Freelancer membership payment via UPI.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Page Preloader -->
  <div id="page-preloader">
    <div class="preloader-spinner"></div>
  </div>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span>FidoConnect</span>
      </a>

      <nav class="desktop-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="post-work.html" class="nav-link">Post a Work</a>
        <a href="find-work.html" class="nav-link">Find Work</a>
        <a href="account.html" class="nav-link">Account</a>
      </nav>

      <div class="header-actions">
        <div id="header-auth-actions">
          <a href="auth.html" class="btn btn-secondary btn-sm">Log in</a>
          <a href="auth.html?mode=register" class="btn btn-primary btn-sm">Join</a>
        </div>
        <a href="post-work.html" class="btn btn-primary btn-sm btn-post-desktop">Post a Work</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container" style="max-width: 860px;">
      
      <!-- Back Link -->
      <div style="margin-bottom: 1.25rem;">
        <a href="account.html?tab=membership" id="payment-back-link" class="btn btn-link btn-sm" style="padding:0; font-weight:600; color:var(--color-accent); display:inline-flex; align-items:center; gap:5px; text-decoration:none;">
          &larr; Back to Membership Plans
        </a>
      </div>

      <!-- Payment Checkout Container (Managed dynamically by js/payment.js) -->
      <div id="payment-checkout-container">
        <div class="card text-center" style="padding: 3rem 1.5rem;">
          <div class="preloader-spinner" style="margin: 0 auto 1rem;"></div>
          <p class="text-muted">Loading secure UPI payment details...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 FidoConnect. All rights reserved.</span>
        <span>Trusted project coordination service.</span>
      </div>
    </div>
  </footer>

  <!-- Fixed Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-nav-grid">
      <a href="index.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>Home</span>
      </a>
      <a href="find-work.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <span>Find Work</span>
      </a>
      <a href="post-work.html" class="mobile-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Post</span>
      </a>
      <a href="account.html" class="mobile-nav-item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Account</span>
      </a>
    </div>
  </nav>

  <!-- Scripts -->
  <script src="js/ui.js"></script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/payment.js"></script>
</body>
</html>
